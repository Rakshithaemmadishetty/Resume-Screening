<!DOCTYPE html>
<html>
<head>
    <title>Results</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

<body>

<div class="result-container">
    <h2>
        <i class="fa-solid fa-chart-column"></i>
        Resume Ranking Results
    </h2>

    <ul>
        {% for name, score in ranked %}
        <li>
            <span><i class="fa-solid fa-file"></i> {{ name }}</span>
            <span>{{ score }}%</span>
        </li>
        {% endfor %}
    </ul>

    <p><a href="{{ url_for('dashboard') }}">Go Back</a></p>
</div>

</body>
</html>
